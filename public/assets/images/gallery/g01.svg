  </g>
  <circle cx="1090" cy="620" r="6" fill="#E84848"/>
  <circle cx="100" cy="300" r="4" fill="#6D5BD3"/>
  <circle cx="285" cy="215" r="3" fill="#6D5BD3"/>
  <circle cx="80" cy="180" r="3" fill="#6D5BD3"/>
