<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" fill="none" role="img" aria-label="Overlapping gradient capsules, abstract teamwork">
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E84848"/>
      <stop offset="1" stop-color="#8E2A2A"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4D7C3A"/>
      <stop offset="1" stop-color="#23491B"/>
    </linearGradient>
    <linearGradient id="lav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D5BD3"/>
      <stop offset="1" stop-color="#332A78"/>
